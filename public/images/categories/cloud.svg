<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cld-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#cld-grad)"/>

  <!-- Multi-Region VPC Nodes -->
  <rect x="60" y="80" width="140" height="180" rx="10" fill="#0E1626" stroke="#06B6D4" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12 font-bold">us-east-1</text>
  <rect x="80" y="130" width="100" height="24" rx="4" fill="#06B6D4" fill-opacity="0.2"/>
  <text x="130" y="146" text-anchor="middle" fill="#A5F3FC" font-family="monospace" font-size="10">GPU Cluster A</text>
  <rect x="80" y="166" width="100" height="24" rx="4" fill="#06B6D4" fill-opacity="0.2"/>
  <text x="130" y="182" text-anchor="middle" fill="#A5F3FC" font-family="monospace" font-size="10">Vector DB</text>

  <rect x="230" y="60" width="140" height="220" rx="10" fill="#0E1626" stroke="#38BDF8" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12 font-bold">Global Router</text>
  <circle cx="300" cy="170" r="36" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="300" cy="170" r="8" fill="#FFFFFF"/>

  <rect x="400" y="80" width="140" height="180" rx="10" fill="#0E1626" stroke="#06B6D4" stroke-width="2"/>
  <text x="470" y="110" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12 font-bold">eu-west-1</text>
  <rect x="420" y="130" width="100" height="24" rx="4" fill="#06B6D4" fill-opacity="0.2"/>
  <text x="470" y="146" text-anchor="middle" fill="#A5F3FC" font-family="monospace" font-size="10">GPU Cluster B</text>
  <rect x="420" y="166" width="100" height="24" rx="4" fill="#06B6D4" fill-opacity="0.2"/>
  <text x="470" y="182" text-anchor="middle" fill="#A5F3FC" font-family="monospace" font-size="10">Edge Cache</text>

  <!-- Connecting paths -->
  <path d="M 200 170 L 230 170 M 370 170 L 400 170" stroke="#38BDF8" stroke-width="3"/>
</svg>
