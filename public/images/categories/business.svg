<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bus-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bus-grad)"/>

  <!-- Enterprise Strategy / Boardroom ROI bars -->
  <g transform="translate(100, 70)">
    <rect width="400" height="200" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="2"/>
    <text x="30" y="36" fill="#E0E7FF" font-family="system-ui, -apple-system, sans-serif" font-size="15 font-bold">Enterprise AI Adoption & Workforce ROI</text>
    
    <!-- Bar chart -->
    <rect x="50" y="140" width="40" height="30" rx="4" fill="#6366F1"/>
    <rect x="120" y="110" width="40" height="60" rx="4" fill="#6366F1"/>
    <rect x="190" y="85" width="40" height="85" rx="4" fill="#818CF8"/>
    <rect x="260" y="60" width="40" height="110" rx="4" fill="#A5B4FC"/>
    <rect x="330" y="35" width="40" height="135" rx="4" fill="#34D399"/>

    <text x="350" y="28" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11 font-bold">+340% ROI</text>
  </g>
</svg>
