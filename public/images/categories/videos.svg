<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="vid-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#vid-grad)"/>

  <!-- Video Player HUD & Waveform -->
  <rect x="80" y="50" width="440" height="240" rx="12" fill="#090D16" stroke="#3B82F6" stroke-width="2"/>
  
  <circle cx="300" cy="150" r="36" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="2"/>
  <polygon points="293,135 293,165 315,150" fill="#FFFFFF"/>

  <!-- Waveform timeline at bottom -->
  <g transform="translate(110, 230)" fill="#60A5FA">
    <rect x="0" y="10" width="6" height="20" rx="3"/>
    <rect x="12" y="4" width="6" height="32" rx="3"/>
    <rect x="24" y="14" width="6" height="12" rx="3"/>
    <rect x="36" y="0" width="6" height="40" rx="3"/>
    <rect x="48" y="6" width="6" height="28" rx="3"/>
    <rect x="60" y="12" width="6" height="16" rx="3"/>
    <rect x="72" y="2" width="6" height="36" rx="3"/>
    
    <rect x="84" y="0" width="200" height="4" rx="2" fill="#1E293B"/>
    <rect x="84" y="0" width="120" height="4" rx="2" fill="#3B82F6"/>
    <circle cx="204" cy="2" r="6" fill="#60A5FA"/>

    <text x="300" y="6" fill="#93C5FD" font-family="monospace" font-size="11 font-bold">12:18 / 18:40</text>
  </g>

  <rect x="110" y="70" width="140" height="24" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="180" y="86" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10 font-bold">EXECUTIVE BRIEFING</text>
</svg>
