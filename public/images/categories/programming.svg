<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="prog-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#prog-grad)"/>

  <rect x="80" y="50" width="440" height="240" rx="12" fill="#090D16" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="80" y="50" width="440" height="34" rx="12" fill="#1E1B4B"/>
  <circle cx="105" cy="67" r="4" fill="#EF4444"/>
  <circle cx="119" cy="67" r="4" fill="#F59E0B"/>
  <circle cx="133" cy="67" r="4" fill="#10B981"/>
  <text x="300" y="72" text-anchor="middle" fill="#DDD6FE" font-family="monospace" font-size="11 font-bold">compiler-ast.rs</text>

  <text x="110" y="120" fill="#A78BFA" font-family="monospace" font-size="13 font-bold">fn</text>
  <text x="135" y="120" fill="#F8FAFC" font-family="monospace" font-size="13">optimize_token_stream(ast: &amp;<tspan fill="#34D399">ASTNode</tspan>) -&gt; <tspan fill="#60A5FA">Result&lt;Stream&gt;</tspan> {</text>

  <text x="135" y="150" fill="#64748B" font-family="monospace" font-size="12">// Zero-copy memory alignment for ultra-low latency</text>
  <text x="135" y="180" fill="#C084FC" font-family="monospace" font-size="13 font-bold">let</text>
  <text x="165" y="180" fill="#E2E8F0" font-family="monospace" font-size="13">pipeline = <tspan fill="#38BDF8">SIMDExecutor::init</tspan>(ast.buffer());</text>

  <rect x="135" y="200" width="320" height="36" rx="6" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="150" y="223" fill="#DDD6FE" font-family="monospace" font-size="12 font-bold">return pipeline.execute_async().await;</text>

  <text x="110" y="260" fill="#F8FAFC" font-family="monospace" font-size="13 font-bold">}</text>
