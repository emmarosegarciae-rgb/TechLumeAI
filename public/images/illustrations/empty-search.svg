<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Empty Search Radar Out of Range</title>
  <desc id="desc">Illustration of search radar scanning empty frequency bands and suggesting query refinement loops.</desc>
  <defs>
    <linearGradient id="search-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow-es" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="24" fill="url(#search-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Radar Grid Circles -->
  <circle cx="300" cy="180" r="140" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.3"/>
  <circle cx="300" cy="180" r="90" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 6" fill="none" opacity="0.3"/>
  <circle cx="300" cy="180" r="40" fill="#2563EB" opacity="0.1"/>

  <!-- Radar Sweep Beam -->
  <path d="M 300 180 L 410 90 A 140 140 0 0 0 300 40 Z" fill="#38BDF8" opacity="0.08"/>
  <line x1="300" y1="180" x2="410" y2="90" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>

  <!-- Magnifying Glass / Query Node Graphic -->
  <g transform="translate(250, 130)" filter="url(#shadow-es)">
    <circle cx="44" cy="44" r="32" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <!-- Inner Question Mark / Search Wave -->
    <path d="M 36 36 C 36 28, 52 28, 52 36 C 52 42, 44 44, 44 50" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="58" r="2.5" fill="#38BDF8"/>
    <!-- Handle -->
    <path d="M 66 66 L 88 88" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Query Refinement Badges Below -->
  <g transform="translate(140, 300)" font-family="monospace" font-size="11" font-weight="700">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="16" y="18" fill="#94A3B8">Refine Keywords</text>

    <rect x="160" y="0" width="160" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="16" y="18" fill="#38BDF8">Check Active Filters</text>
  </g>
</svg>
