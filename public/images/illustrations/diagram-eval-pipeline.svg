<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">AI Evaluation Stack &amp; Continuous Regression Pipeline</title>
  <desc id="desc">Data science harness mapping golden dataset evaluation loops against prompt regressions, retrieval faithfulness, and human grading.</desc>
  <defs>
    <linearGradient id="bg-eval" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-node" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-eval)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <path d="M 0 90 L 800 90 M 0 180 L 800 180 M 0 270 L 800 270 M 0 360 L 800 360" />
    <path d="M 160 0 L 160 450 M 320 0 L 320 450 M 480 0 L 480 450 M 640 0 L 640 450" />
  </g>

  <!-- Diagram Header -->
  <text x="40" y="42" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" tracking="3">EVALUATION PIPELINE v3.0</text>
  <text x="40" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Automated Quality Scoring &amp; Retrieval Faithfulness Harness</text>

  <!-- Connecting Lines -->
  <g fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
    <path d="M 160 140 L 260 200" />
    <path d="M 160 310 L 260 250" />
    <path d="M 410 225 L 490 225" />
    <path d="M 640 225 L 690 225" />
  </g>
  <g fill="#38BDF8">
    <polygon points="256,196 264,204 256,208"/>
    <polygon points="256,254 264,246 256,242"/>
    <polygon points="486,220 496,225 486,230"/>
    <polygon points="686,220 696,225 686,230"/>
  </g>

  <!-- Left Inputs: Test Datasets -->
  <g transform="translate(40, 95)" filter="url(#shadow-node)">
    <rect width="120" height="74" rx="10" fill="url(#node-grad)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#38BDF8"/>
    <text x="30" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Golden Suite</text>
    <text x="18" y="46" fill="#94A3B8" font-family="monospace" font-size="9">1,200 Benchmark Qs</text>
    <rect x="18" y="54" width="70" height="8" rx="2" fill="#38BDF8" fill-opacity="0.3"/>
  </g>

  <g transform="translate(40, 275)" filter="url(#shadow-node)">
    <rect width="120" height="74" rx="10" fill="url(#node-grad)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#10B981"/>
    <text x="30" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Prod Telemetry</text>
    <text x="18" y="46" fill="#94A3B8" font-family="monospace" font-size="9">Live User Feedback</text>
    <rect x="18" y="54" width="84" height="8" rx="2" fill="#10B981" fill-opacity="0.3"/>
  </g>

  <!-- Center Node: Automated Evaluation Engine -->
  <g transform="translate(266, 160)" filter="url(#shadow-node)">
    <rect width="144" height="130" rx="14" fill="url(#node-grad)" stroke="#3B82F6" stroke-width="2.5"/>
    <circle cx="22" cy="26" r="6" fill="#3B82F6"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Eval Runner</text>
    <rect x="22" y="48" width="100" height="20" rx="4" fill="#1E293B"/>
    <text x="30" y="62" fill="#38BDF8" font-family="monospace" font-size="10">Faithfulness Check</text>
    <rect x="22" y="74" width="100" height="20" rx="4" fill="#1E293B"/>
    <text x="30" y="88" fill="#10B981" font-family="monospace" font-size="10">Toxic Classifier</text>
    <rect x="22" y="100" width="100" height="18" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="30" y="113" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">LLM-AS-A-JUDGE</text>
  </g>

  <!-- Right Node: Human Grader Sample Loop -->
  <g transform="translate(496, 175)" filter="url(#shadow-node)">
    <rect width="144" height="100" rx="12" fill="url(#node-grad)" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="22" cy="26" r="5" fill="#F59E0B"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Human Review</text>
    <rect x="22" y="48" width="100" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="30" y="61" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="700">5% Ambiguous Pool</text>
    <text x="22" y="82" fill="#94A3B8" font-family="monospace" font-size="10">Alignment Concordance</text>
  </g>

  <!-- Far Right Dashboard Indicator -->
  <g transform="translate(696, 185)" filter="url(#shadow-node)">
    <rect width="78" height="80" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="14" y="28" fill="#94A3B8" font-family="monospace" font-size="9" font-weight="700">SCORE</text>
    <text x="14" y="58" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">98.4</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 415)" font-family="monospace" font-size="11" fill="#64748B">
    <circle cx="6" cy="-4" r="4" fill="#38BDF8"/>
    <text x="16" y="0">Automated Suite</text>
    <circle cx="150" cy="-4" r="4" fill="#F59E0B"/>
    <text x="160" y="0">Expert Verification</text>
    <circle cx="310" cy="-4" r="4" fill="#10B981"/>
    <text x="320" y="0">Deployment Gate Passed</text>
  </g>
</svg>
