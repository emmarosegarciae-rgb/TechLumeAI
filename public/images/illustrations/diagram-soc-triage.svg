<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">AI-Assisted SOC Triage &amp; Context Fusion Topology</title>
  <desc id="desc">System architecture diagram illustrating raw security telemetry correlating across identity graphs, asset criticality, and automated blast radius containment.</desc>
  <defs>
    <linearGradient id="bg-soc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-node" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-soc)"/>

  <!-- Grid & Radar Elements -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <circle cx="400" cy="225" r="160" fill="none"/>
    <circle cx="400" cy="225" r="100" fill="none"/>
    <circle cx="400" cy="225" r="40" fill="none"/>
    <line x1="100" y1="225" x2="700" y2="225"/>
    <line x1="400" y1="40" x2="400" y2="410"/>
  </g>

  <!-- Diagram Header -->
  <text x="40" y="42" fill="#06B6D4" font-family="monospace" font-size="11" font-weight="700" tracking="3">SOC ARCHITECTURE v2.1</text>
  <text x="40" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Automated Threat Context Correlation &amp; Blast Radius Containment</text>

  <!-- Connecting Lines -->
  <g fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="6 6">
    <path d="M 160 140 L 260 200" />
    <path d="M 160 310 L 260 250" />
    <path d="M 400 225 L 540 225" />
    <path d="M 660 225 L 720 225" />
  </g>
  <g fill="#06B6D4">
    <polygon points="256,196 264,204 256,208"/>
    <polygon points="256,254 264,246 256,242"/>
    <polygon points="536,220 546,225 536,230"/>
    <polygon points="716,220 726,225 716,230"/>
  </g>

  <!-- Left Inputs: Telemetry Sources -->
  <g transform="translate(40, 95)" filter="url(#shadow-node)">
    <rect width="120" height="74" rx="10" fill="url(#node-grad)" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#3B82F6"/>
    <text x="30" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Identity Logs</text>
    <text x="18" y="46" fill="#94A3B8" font-family="monospace" font-size="9">Okta / Azure AD</text>
    <rect x="18" y="54" width="60" height="8" rx="2" fill="#3B82F6" fill-opacity="0.3"/>
  </g>

  <g transform="translate(40, 275)" filter="url(#shadow-node)">
    <rect width="120" height="74" rx="10" fill="url(#node-grad)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#F59E0B"/>
    <text x="30" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Cloud Alerts</text>
    <text x="18" y="46" fill="#94A3B8" font-family="monospace" font-size="9">AWS GuardDuty</text>
    <rect x="18" y="54" width="76" height="8" rx="2" fill="#F59E0B" fill-opacity="0.3"/>
  </g>

  <!-- Center Node: AI Context Fusion Engine -->
  <g transform="translate(266, 160)" filter="url(#shadow-node)">
    <rect width="154" height="130" rx="14" fill="url(#node-grad)" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="22" cy="26" r="6" fill="#06B6D4"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Fusion Engine</text>
    <rect x="22" y="48" width="110" height="20" rx="4" fill="#1E293B"/>
    <text x="30" y="62" fill="#06B6D4" font-family="monospace" font-size="10" font-weight="700">Asset Criticality: P1</text>
    <rect x="22" y="74" width="110" height="20" rx="4" fill="#1E293B"/>
    <text x="30" y="88" fill="#38BDF8" font-family="monospace" font-size="10">Privilege: Admin</text>
    <rect x="22" y="100" width="110" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="30" y="113" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="700">EXPOSED ROUTE</text>
  </g>

  <!-- Right Node: Automated Blast Radius Isolation -->
  <g transform="translate(546, 175)" filter="url(#shadow-node)">
    <rect width="140" height="100" rx="12" fill="url(#node-grad)" stroke="#10B981" stroke-width="2"/>
    <circle cx="22" cy="26" r="5" fill="#10B981"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Triage Decision</text>
    <rect x="22" y="48" width="96" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="30" y="61" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">Revoke Token</text>
    <text x="22" y="82" fill="#94A3B8" font-family="monospace" font-size="10">MTTR Reduced: 94%</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 415)" font-family="monospace" font-size="11" fill="#64748B">
    <circle cx="6" cy="-4" r="4" fill="#3B82F6"/>
    <text x="16" y="0">Identity Signal</text>
    <circle cx="150" cy="-4" r="4" fill="#06B6D4"/>
    <text x="160" y="0">Graph Correlation</text>
    <circle cx="310" cy="-4" r="4" fill="#10B981"/>
    <text x="320" y="0">Automated Remediation</text>
  </g>
</svg>
