<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Agent Multi-Tier Routing Architecture</title>
  <desc id="desc">System diagram showing input request routing through permission gateways, model evaluation guardrails, and human review loops.</desc>
  <defs>
    <linearGradient id="bg-routing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-node" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-routing)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <path d="M 0 90 L 800 90 M 0 180 L 800 180 M 0 270 L 800 270 M 0 360 L 800 360" />
    <path d="M 160 0 L 160 450 M 320 0 L 320 450 M 480 0 L 480 450 M 640 0 L 640 450" />
  </g>

  <!-- Diagram Header -->
  <text x="40" y="42" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" tracking="3">TOPOLOGY v3.2</text>
  <text x="40" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Multi-Turn Agent Orchestration &amp; Guardrail Pipeline</text>

  <!-- Connecting Arrows -->
  <g fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input to Orchestrator -->
    <path d="M 140 230 L 190 230" />
    <polygon points="186,225 196,230 186,235" fill="#38BDF8"/>
    <!-- Orchestrator to Permission Gateway -->
    <path d="M 340 230 L 390 230" />
    <polygon points="386,225 396,230 386,235" fill="#38BDF8"/>
    <!-- Permission Gateway Split: Top (Execution) and Bottom (Human Loop) -->
    <path d="M 540 200 C 570 200, 570 140, 600 140" />
    <polygon points="596,135 606,140 596,145" fill="#38BDF8"/>
    <path d="M 540 260 C 570 260, 570 320, 600 320" />
    <polygon points="596,315 606,320 596,325" fill="#38BDF8"/>
  </g>

  <!-- Node 1: Input Request -->
  <g transform="translate(30, 190)" filter="url(#shadow-node)">
    <rect width="110" height="80" rx="12" fill="url(#node-grad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#38BDF8"/>
    <text x="34" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">User Prompt</text>
    <text x="20" y="52" fill="#94A3B8" font-family="monospace" font-size="10">Context: Enterprise</text>
  </g>

  <!-- Node 2: Agent Orchestrator -->
  <g transform="translate(196, 175)" filter="url(#shadow-node)">
    <rect width="144" height="110" rx="12" fill="url(#node-grad)" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="22" cy="26" r="6" fill="#3B82F6"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Orchestrator</text>
    <rect x="22" y="48" width="100" height="18" rx="4" fill="#1E293B"/>
    <text x="30" y="61" fill="#38BDF8" font-family="monospace" font-size="10">Stateful Memory</text>
    <rect x="22" y="74" width="100" height="18" rx="4" fill="#1E293B"/>
    <text x="30" y="87" fill="#10B981" font-family="monospace" font-size="10">Tool Router</text>
  </g>

  <!-- Node 3: Zero-Trust Permission Gateway -->
  <g transform="translate(396, 175)" filter="url(#shadow-node)">
    <rect width="144" height="110" rx="12" fill="url(#node-grad)" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="22" cy="26" r="6" fill="#06B6D4"/>
    <text x="36" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Guardrail Gate</text>
    <rect x="22" y="48" width="100" height="18" rx="4" fill="#06B6D4" fill-opacity="0.15"/>
    <text x="30" y="61" fill="#06B6D4" font-family="monospace" font-size="10" font-weight="700">RBAC Identity</text>
    <rect x="22" y="74" width="100" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
    <text x="30" y="87" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">Policy Verified</text>
  </g>

  <!-- Node 4A: Execution Sandbox -->
  <g transform="translate(606, 95)" filter="url(#shadow-node)">
    <rect width="160" height="90" rx="12" fill="url(#node-grad)" stroke="#10B981" stroke-width="2"/>
    <circle cx="22" cy="24" r="5" fill="#10B981"/>
    <text x="36" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Sandbox Worker</text>
    <text x="22" y="52" fill="#94A3B8" font-family="monospace" font-size="10">API / DB / Terminal</text>
    <rect x="22" y="64" width="70" height="14" rx="3" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="74" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">ISOLATED</text>
  </g>

  <!-- Node 4B: Human-In-The-Loop Approval -->
  <g transform="translate(606, 275)" filter="url(#shadow-node)">
    <rect width="160" height="90" rx="12" fill="url(#node-grad)" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="22" cy="24" r="5" fill="#F59E0B"/>
    <text x="36" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Human Approval</text>
    <text x="22" y="52" fill="#94A3B8" font-family="monospace" font-size="10">Privileged Action</text>
    <rect x="22" y="64" width="86" height="14" rx="3" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="28" y="74" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="700">REVIEW REQUIRED</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 415)" font-family="monospace" font-size="11" fill="#64748B">
    <circle cx="6" cy="-4" r="4" fill="#3B82F6"/>
    <text x="16" y="0">Autonomous Path</text>
    <circle cx="160" cy="-4" r="4" fill="#F59E0B"/>
    <text x="170" y="0">Human Intervention Boundary</text>
    <circle cx="380" cy="-4" r="4" fill="#10B981"/>
    <text x="390" y="0">Verified Secure Output</text>
  </g>
</svg>
