<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Nora Klein - Security &amp; Cloud Correspondent</title>
  <desc id="desc">Flat geometric editorial portrait of Nora Klein with zero-trust cybersecurity and cloud resilience motifs.</desc>
  <defs>
    <linearGradient id="nora-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="nora-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="256" height="256" rx="64" fill="url(#nora-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Background Technical Signal Motifs (Zero-Trust Security & Cloud) -->
  <g opacity="0.25" stroke="#10B981" stroke-width="1.5" fill="none">
    <!-- Security Shield Outline -->
    <path d="M 196 52 L 220 60 L 220 80 C 220 98, 208 112, 196 118 C 184 112, 172 98, 172 80 L 172 60 Z" stroke-dasharray="3 3"/>
    <circle cx="196" cy="84" r="6" stroke="#10B981" stroke-width="2"/>
    <!-- Cloud Nodes -->
    <circle cx="56" cy="76" r="16" stroke="#06B6D4"/>
    <circle cx="68" cy="68" r="14" stroke="#06B6D4"/>
    <circle cx="44" cy="68" r="14" stroke="#06B6D4"/>
    <path d="M 40 180 L 76 180" stroke="#10B981" stroke-width="2"/>
    <circle cx="58" cy="180" r="3" fill="#10B981"/>
  </g>

  <!-- Geometric Portrait -->
  <g filter="url(#shadow-sm)">
    <!-- Shoulders / Coat -->
    <path d="M 56 236 C 68 186, 188 186, 200 236 Z" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 104 186 L 128 236 L 152 186 Z" fill="url(#nora-accent)" opacity="0.85"/>
    <!-- Neck -->
    <rect x="114" y="140" width="28" height="24" rx="6" fill="#F1F5F9"/>
    <!-- Head Silhouette -->
    <rect x="92" y="78" width="72" height="78" rx="36" fill="#F8FAFC"/>
    <!-- Elegant Wavy/Layered Hair Silhouette -->
    <path d="M 88 106 C 88 64, 168 64, 168 106 C 168 132, 172 152, 176 166 L 166 166 C 162 148, 158 132, 158 106 C 158 76, 98 76, 98 106 C 98 132, 94 148, 90 166 L 80 166 C 84 152, 88 132, 88 106 Z" fill="#0F172A"/>
    <!-- Minimalist Eye / Expression Framing -->
    <circle cx="112" cy="114" r="3.5" fill="#0F172A"/>
    <circle cx="144" cy="114" r="3.5" fill="#0F172A"/>
    <path d="M 106 104 C 110 102, 116 102, 118 104" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 138 104 C 140 102, 146 102, 150 104" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Security Verification Shield Badge -->
  <g transform="translate(186, 204)" filter="url(#shadow-sm)">
    <circle cx="16" cy="16" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 16 8 L 22 10.5 L 22 15.5 C 22 20, 19.5 23.5, 16 25 C 12.5 23.5, 10 20, 10 15.5 L 10 10.5 Z" fill="#FFFFFF"/>
    <path d="M 13.5 16 L 15.5 18 L 19 13.5" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
