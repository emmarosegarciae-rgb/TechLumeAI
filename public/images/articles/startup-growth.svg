<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-growth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#1A1F2C"/>
    </linearGradient>
    <linearGradient id="curve-growth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow-growth">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-growth)"/>

  <!-- Grid background -->
  <g stroke="#262D3D" stroke-width="1" opacity="0.5">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" />
    <path d="M 160 0 L 160 480 M 320 0 L 320 480 M 480 0 L 480 480 M 640 0 L 640 480" />
  </g>

  <!-- Left Card: Compounding Expansion Chart -->
  <g transform="translate(40, 50)" filter="url(#shadow-growth)">
    <rect width="440" height="380" rx="14" fill="#131722" stroke="#333D52" stroke-width="1.5"/>

    <text x="28" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Compounding AI SaaS Revenue Velocity</text>
    <text x="28" y="58" fill="#94A3B8" font-family="monospace" font-size="11">Net Dollar Retention (NDR) vs Usage-Based Token Expansion</text>

    <!-- Chart canvas -->
    <rect x="28" y="80" width="384" height="200" rx="8" fill="#0B0E14" stroke="#262D3D"/>
    
    <!-- Exponential Growth Curve -->
    <path d="M 28 260 Q 180 240, 260 180 T 412 100 L 412 280 L 28 280 Z" fill="url(#curve-growth)"/>
    <path d="M 28 260 Q 180 240, 260 180 T 412 100" fill="none" stroke="#34D399" stroke-width="3"/>
    
    <!-- Points and Tooltip -->
    <circle cx="260" cy="180" r="5" fill="#34D399"/>
    <circle cx="340" cy="132" r="5" fill="#34D399"/>
    <circle cx="412" cy="100" r="6" fill="#34D399"/>

    <g transform="translate(240, 110)">
      <rect width="130" height="42" rx="6" fill="#1A1F2C" stroke="#34D399"/>
      <text x="65" y="18" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Series B Benchmark</text>
      <text x="65" y="34" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">142% Net Retention</text>
    </g>

    <!-- KPI Row -->
    <rect x="28" y="300" width="120" height="58" rx="6" fill="#1A1F2C"/>
    <text x="40" y="322" fill="#94A3B8" font-family="monospace" font-size="10">CAC Payback</text>
    <text x="40" y="344" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">4.2 Months</text>

    <rect x="160" y="300" width="120" height="58" rx="6" fill="#1A1F2C"/>
    <text x="172" y="322" fill="#94A3B8" font-family="monospace" font-size="10">PLG Conversion</text>
    <text x="172" y="344" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">8.4% Rate</text>

    <rect x="292" y="300" width="120" height="58" rx="6" fill="#1A1F2C"/>
    <text x="304" y="322" fill="#94A3B8" font-family="monospace" font-size="10">Gross Margin</text>
    <text x="304" y="344" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">82.1%</text>
  </g>

  <!-- Right Card: Distribution Flywheel Nodes -->
  <g transform="translate(510, 50)" filter="url(#shadow-growth)">
    <rect width="250" height="380" rx="14" fill="#131722" stroke="#333D52" stroke-width="1.5"/>
    <text x="24" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Compounding Flywheel</text>
    <text x="24" y="58" fill="#94A3B8" font-family="monospace" font-size="11">Agentic Workflow Loops</text>

    <!-- Flywheel Steps -->
    <!-- Step 1 -->
    <rect x="20" y="84" width="210" height="66" rx="8" fill="#1A1F2C" stroke="#3B82F6"/>
    <circle cx="38" cy="117" r="10" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="38" y="121" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="11 font-bold">1</text>
    <text x="58" y="110" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Developer SDK Integration</text>
    <text x="58" y="128" fill="#94A3B8" font-family="monospace" font-size="10">Zero-config npm / API drop-in</text>

    <!-- Step 2 -->
    <rect x="20" y="166" width="210" height="66" rx="8" fill="#1A1F2C" stroke="#F59E0B"/>
    <circle cx="38" cy="199" r="10" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="38" y="203" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="11 font-bold">2</text>
    <text x="58" y="192" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Usage-Based Expansion</text>
    <text x="58" y="210" fill="#94A3B8" font-family="monospace" font-size="10">Token consumption & seats</text>

    <!-- Step 3 -->
    <rect x="20" y="248" width="210" height="66" rx="8" fill="#1A1F2C" stroke="#34D399"/>
    <circle cx="38" cy="281" r="10" fill="#34D399" fill-opacity="0.2"/>
    <text x="38" y="285" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11 font-bold">3</text>
    <text x="58" y="274" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Enterprise SOC2 Upgrades</text>
    <text x="58" y="292" fill="#94A3B8" font-family="monospace" font-size="10">SSO, audit logs & dedicated VPC</text>

    <rect x="20" y="330" width="210" height="34" rx="6" fill="#34D399" fill-opacity="0.15" stroke="#34D399"/>
    <text x="125" y="351" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11 font-bold">Moat: System Data Gravity</text>
  </g>
</svg>
