<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card-grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-grad2)"/>

  <!-- Grid lines -->
  <g stroke="#1F2937" stroke-width="1">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" />
    <path d="M 160 0 L 160 480 M 320 0 L 320 480 M 480 0 L 480 480 M 640 0 L 640 480" />
  </g>

  <!-- Left Card: Gateway Routing -->
  <g transform="translate(40, 60)" filter="url(#shadow2)">
    <rect width="320" height="360" rx="12" fill="url(#card-grad2)" stroke="#374151" stroke-width="1.5"/>
    
    <text x="24" y="36" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Multi-Model Gateway Router</text>
    <text x="24" y="56" fill="#9CA3AF" font-family="monospace" font-size="11">Active Fallback & Latency Optimization</text>

    <!-- Route 1 -->
    <rect x="24" y="80" width="272" height="64" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="46" cy="112" r="6" fill="#3B82F6"/>
    <text x="64" y="106" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Frontier Reasoning API</text>
    <text x="64" y="124" fill="#60A5FA" font-family="monospace" font-size="10">Latency: 140ms · Priority: High</text>
    <rect x="226" y="96" width="54" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="253" y="110" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="700">62.4%</text>

    <!-- Route 2 -->
    <rect x="24" y="156" width="272" height="64" rx="8" fill="#111827" stroke="#10B981" stroke-width="1"/>
    <circle cx="46" cy="188" r="6" fill="#10B981"/>
    <text x="64" y="182" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Open Weights Cluster (Llama 3.3)</text>
    <text x="64" y="200" fill="#34D399" font-family="monospace" font-size="10">Latency: 38ms · Local VPC Edge</text>
    <rect x="226" y="172" width="54" height="20" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="253" y="186" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">28.1%</text>

    <!-- Route 3 -->
    <rect x="24" y="232" width="272" height="64" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="46" cy="264" r="6" fill="#F59E0B"/>
    <text x="64" y="258" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Specialized Code Model (DeepSeek)</text>
    <text x="64" y="276" fill="#FBBF24" font-family="monospace" font-size="10">Latency: 52ms · Batch Processing</text>
    <rect x="226" y="248" width="54" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="253" y="262" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="700">9.5%</text>

    <rect x="24" y="316" width="272" height="28" rx="6" fill="#1E293B"/>
    <text x="160" y="334" text-anchor="middle" fill="#9CA3AF" font-family="monospace" font-size="11 font-semibold">Total Inference Cost Savings: $4,280/mo</text>
  </g>

  <!-- Right Card: Performance Curves -->
  <g transform="translate(390, 60)" filter="url(#shadow2)">
    <rect width="370" height="360" rx="12" fill="url(#card-grad2)" stroke="#374151" stroke-width="1.5"/>
    <text x="24" y="36" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Throughput & Latency Benchmarks</text>
    <text x="24" y="56" fill="#9CA3AF" font-family="monospace" font-size="11">Tokens/sec vs Context Window Scaling</text>

    <!-- Chart area -->
    <rect x="24" y="80" width="322" height="180" rx="8" fill="#0B0F19" stroke="#1F2937"/>
    <path d="M 24 210 Q 100 130, 180 140 T 346 90" fill="url(#chart-grad)" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M 24 230 Q 120 180, 220 170 T 346 150" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Data points -->
    <circle cx="180" cy="140" r="4" fill="#3B82F6"/>
    <circle cx="280" cy="115" r="4" fill="#3B82F6"/>
    <circle cx="220" cy="170" r="4" fill="#10B981"/>

    <!-- Legend -->
    <circle cx="44" cy="286" r="4" fill="#3B82F6"/>
    <text x="56" y="290" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif" font-size="11 font-semibold">Gateway Dynamic Routing</text>

    <circle cx="210" cy="286" r="4" fill="#10B981"/>
    <text x="222" y="290" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif" font-size="11 font-semibold">Static API Endpoint</text>

    <rect x="24" y="316" width="155" height="28" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
    <text x="101" y="334" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11 font-bold">99.99% Uptime SLA</text>

    <rect x="191" y="316" width="155" height="28" rx="6" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="1"/>
    <text x="268" y="334" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="11 font-bold">P99: 42ms</text>
  </g>
</svg>
