<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-eval" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow-eval">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-eval)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" />
    <path d="M 160 0 L 160 480 M 320 0 L 320 480 M 480 0 L 480 480 M 640 0 L 640 480" />
  </g>

  <!-- Left Card: Golden Dataset & Test Harness -->
  <g transform="translate(40, 50)" filter="url(#shadow-eval)">
    <rect width="430" height="380" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <text x="28" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Golden Dataset Evaluation Suite</text>
    <text x="28" y="58" fill="#38BDF8" font-family="monospace" font-size="11">Automated CI/CD Prompt Regression & Accuracy Benchmarks</text>

    <!-- Evaluation Run Header -->
    <rect x="28" y="80" width="374" height="46" rx="8" fill="#1E293B" stroke="#334155"/>
    <circle cx="48" cy="103" r="5" fill="#10B981"/>
    <text x="64" y="107" fill="#F8FAFC" font-family="monospace" font-size="12 font-bold">Suite: prod-agent-v3.1-eval.json</text>
    <text x="310" y="107" fill="#10B981" font-family="monospace" font-size="11 font-bold">Passed (498/500)</text>

    <!-- Test Cases Table -->
    <text x="28" y="148" fill="#94A3B8" font-family="monospace" font-size="11 uppercase">Test Category</text>
    <text x="220" y="148" fill="#94A3B8" font-family="monospace" font-size="11 uppercase">Metric Type</text>
    <text x="340" y="148" fill="#94A3B8" font-family="monospace" font-size="11 uppercase">Score</text>

    <!-- Row 1 -->
    <rect x="28" y="160" width="374" height="42" rx="6" fill="#1E293B"/>
    <text x="42" y="186" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13 font-semibold">Faithfulness & Hallucination Check</text>
    <text x="220" y="186" fill="#A78BFA" font-family="monospace" font-size="11">LLM-as-Judge</text>
    <text x="340" y="186" fill="#10B981" font-family="monospace" font-size="13 font-bold">99.6%</text>

    <!-- Row 2 -->
    <rect x="28" y="212" width="374" height="42" rx="6" fill="#1E293B"/>
    <text x="42" y="238" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13 font-semibold">SQL Generation Syntax Accuracy</text>
    <text x="220" y="238" fill="#38BDF8" font-family="monospace" font-size="11">Exact Match AST</text>
    <text x="340" y="238" fill="#10B981" font-family="monospace" font-size="13 font-bold">98.2%</text>

    <!-- Row 3 -->
    <rect x="28" y="264" width="374" height="42" rx="6" fill="#1E293B"/>
    <text x="42" y="290" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13 font-semibold">Adversarial Jailbreak Resistance</text>
    <text x="220" y="290" fill="#F43F5E" font-family="monospace" font-size="11">Red-Team Suite</text>
    <text x="340" y="290" fill="#10B981" font-family="monospace" font-size="13 font-bold">100%</text>

    <!-- Summary Box -->
    <rect x="28" y="320" width="374" height="40" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
    <text x="215" y="345" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12 font-bold">✓ Zero Critical Regressions Detected</text>
  </g>

  <!-- Right Card: Evaluation Loop Architecture -->
  <g transform="translate(500, 50)" filter="url(#shadow-eval)">
    <rect width="260" height="380" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Evaluation Pipeline</text>
    <text x="24" y="58" fill="#94A3B8" font-family="monospace" font-size="11">Continuous Feedback Loop</text>

    <!-- Stage 1 -->
    <rect x="20" y="84" width="220" height="66" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="36" y="108" fill="#38BDF8" font-family="monospace" font-size="11 font-bold">1. Production Traces</text>
    <text x="36" y="128" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Capture agent inputs/outputs & user flags</text>

    <!-- Stage 2 -->
    <rect x="20" y="166" width="220" height="66" rx="8" fill="#1E293B" stroke="#A78BFA"/>
    <text x="36" y="190" fill="#A78BFA" font-family="monospace" font-size="11 font-bold">2. Synthetic Dataset Engine</text>
    <text x="36" y="210" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Generate edge cases & adversarial queries</text>

    <!-- Stage 3 -->
    <rect x="20" y="248" width="220" height="66" rx="8" fill="#1E293B" stroke="#10B981"/>
    <text x="36" y="272" fill="#34D399" font-family="monospace" font-size="11 font-bold">3. Automated CI Regression</text>
    <text x="36" y="292" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Block deployments if fidelity drops</text>

    <rect x="20" y="330" width="220" height="34" rx="6" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="130" y="351" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11 font-bold">Fidelity Score: 99.4%</text>
  </g>
</svg>
